spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledgerdb}
spring.datasource.username=${LEDGER_DB_USERNAME:ledgerdb}
spring.datasource.password=${LEDGER_DB_PASSWORD:ledgerdb}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.table=flyway_schema_history_ledger

security.jwt.enforce=false
